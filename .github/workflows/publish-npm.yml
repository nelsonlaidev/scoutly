name: Publish npm package

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: scoutly-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - name: Validate release plan
        shell: bash
        run: |
          set -euo pipefail

          release_count="$(jq -r '[.releases[] | select(.app_name == "scoutly")] | length' <<< "${PLAN}")"
          if [[ "${release_count}" != "1" ]]; then
            echo "Expected exactly one Scoutly release, found ${release_count}" >&2
            exit 1
          fi

          version="$(jq -r '.releases[] | select(.app_name == "scoutly") | .app_version' <<< "${PLAN}")"
          tag="$(jq -r '.announcement_tag' <<< "${PLAN}")"
          is_prerelease="$(jq -r '.announcement_is_prerelease' <<< "${PLAN}")"
          artifact_count="$(jq -r '[.releases[] | select(.app_name == "scoutly") | .artifacts[] | select(endswith("-npm-package.tar.gz"))] | length' <<< "${PLAN}")"

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${version}" >&2
            exit 1
          fi
          if [[ "${tag}" != "v${version}" ]]; then
            echo "Release tag ${tag} does not match version ${version}" >&2
            exit 1
          fi
          if [[ "${artifact_count}" != "1" ]]; then
            echo "Expected exactly one Scoutly npm package, found ${artifact_count}" >&2
            exit 1
          fi

          if [[ "${version}" == *-* ]]; then
            expected_prerelease="true"
            npm_dist_tag="beta"
          else
            expected_prerelease="false"
            npm_dist_tag="latest"
          fi
          if [[ "${is_prerelease}" != "${expected_prerelease}" ]]; then
            echo "Dist prerelease state does not match version ${version}" >&2
            exit 1
          fi

          npm_artifact_name="$(jq -r '.releases[] | select(.app_name == "scoutly") | .artifacts[] | select(endswith("-npm-package.tar.gz"))' <<< "${PLAN}")"
          if [[ "${npm_artifact_name}" == */* ]]; then
            echo "Unexpected npm artifact path: ${npm_artifact_name}" >&2
            exit 1
          fi
          echo "SCOUTLY_RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "NPM_ARTIFACT_NAME=${npm_artifact_name}" >> "${GITHUB_ENV}"
          echo "NPM_DIST_TAG=${npm_dist_tag}" >> "${GITHUB_ENV}"

      - name: Download npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts-build-global
          path: artifacts

      - name: Verify npm package
        shell: bash
        run: |
          set -euo pipefail

          package_path="artifacts/${NPM_ARTIFACT_NAME}"
          if [[ ! -f "${package_path}" ]]; then
            echo "Missing npm package: ${package_path}" >&2
            exit 1
          fi
          if [[ ! -f artifacts/sha256.sum ]]; then
            echo "Missing cargo-dist checksum manifest" >&2
            exit 1
          fi

          (
            cd artifacts
            sha256sum --check --ignore-missing sha256.sum
          )

          package_json="$(tar -xOzf "${package_path}" package/package.json)"
          package_name="$(jq -r '.name' <<< "${package_json}")"
          package_version="$(jq -r '.version' <<< "${package_json}")"
          package_repository="$(jq -r '.repository' <<< "${package_json}")"

          if [[ "${package_name}" != "@nelsonlaidev/scoutly" ]]; then
            echo "Unexpected npm package name: ${package_name}" >&2
            exit 1
          fi
          if [[ "${package_version}" != "${SCOUTLY_RELEASE_VERSION}" ]]; then
            echo "npm package version ${package_version} does not match release version ${SCOUTLY_RELEASE_VERSION}" >&2
            exit 1
          fi
          if [[ "${package_repository}" != "https://github.com/nelsonlaidev/scoutly" ]]; then
            echo "Unexpected npm package repository: ${package_repository}" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify trusted publishing requirements
        shell: bash
        run: |
          set -euo pipefail

          npm_version="$(npm --version)"
          IFS=. read -r npm_major npm_minor npm_patch <<< "${npm_version}"
          if (( npm_major < 11 || (npm_major == 11 && npm_minor < 5) || (npm_major == 11 && npm_minor == 5 && npm_patch < 1) )); then
            echo "npm 11.5.1 or newer is required for trusted publishing; found ${npm_version}" >&2
            exit 1
          fi

      - name: Check npm publication
        id: publication
        shell: bash
        run: |
          set -euo pipefail

          status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' \
            "https://registry.npmjs.org/%40nelsonlaidev%2Fscoutly/${SCOUTLY_RELEASE_VERSION}")"

          case "${status}" in
            200)
              echo "@nelsonlaidev/scoutly ${SCOUTLY_RELEASE_VERSION} is already published"
              echo "already_published=true" >> "${GITHUB_OUTPUT}"
              ;;
            404)
              echo "already_published=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Unexpected npm registry response for @nelsonlaidev/scoutly ${SCOUTLY_RELEASE_VERSION}: HTTP ${status}" >&2
              exit 1
              ;;
          esac

      - name: Publish npm package
        if: steps.publication.outputs.already_published != 'true'
        run: >-
          npm publish "./artifacts/${NPM_ARTIFACT_NAME}"
          --access public
          --tag "${NPM_DIST_TAG}"
          --provenance
