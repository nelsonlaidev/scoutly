name: Publish Homebrew cask

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true

concurrency:
  group: scoutly-homebrew-tap
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - name: Download Apple Silicon macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts-build-local-aarch64-apple-darwin
          path: artifacts

      - name: Download Intel macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts-build-local-x86_64-apple-darwin
          path: artifacts

      - name: Download ARM64 Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts-build-local-aarch64-unknown-linux-gnu
          path: artifacts

      - name: Download x86_64 Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts-build-local-x86_64-unknown-linux-gnu
          path: artifacts

      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: main
          repository: nelsonlaidev/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Generate Homebrew cask
        id: cask
        shell: bash
        run: |
          set -euo pipefail

          release_count="$(jq -r '.releases | length' <<< "${PLAN}")"
          app_name="$(jq -r '.releases[0].app_name' <<< "${PLAN}")"
          version="$(jq -r '.releases[0].app_version' <<< "${PLAN}")"
          tag="$(jq -r '.announcement_tag' <<< "${PLAN}")"
          is_prerelease="$(jq -r '.announcement_is_prerelease' <<< "${PLAN}")"

          if [[ "${release_count}" != "1" || "${app_name}" != "scoutly" ]]; then
            echo "Expected exactly one Scoutly release in the dist plan" >&2
            exit 1
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${version}" >&2
            exit 1
          fi
          if [[ "${tag}" != "v${version}" ]]; then
            echo "Release tag ${tag} does not match version ${version}" >&2
            exit 1
          fi

          if [[ "${version}" == *-* ]]; then
            expected_prerelease="true"
            cask_token="scoutly@beta"
            cask_name="Scoutly Beta"
          else
            expected_prerelease="false"
            cask_token="scoutly"
            cask_name="Scoutly"
          fi
          if [[ "${is_prerelease}" != "${expected_prerelease}" ]]; then
            echo "Dist prerelease state does not match version ${version}" >&2
            exit 1
          fi

          checksum_for() {
            local archive="$1"
            local checksum_file
            local archive_file
            local checksum
            local -a matches

            mapfile -t matches < <(find artifacts -type f -name "${archive}.sha256" -print)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "Expected one checksum file for ${archive}, found ${#matches[@]}" >&2
              return 1
            fi

            checksum_file="${matches[0]}"
            archive_file="${checksum_file%.sha256}"
            if [[ ! -f "${archive_file}" ]]; then
              echo "Missing release archive: ${archive_file}" >&2
              return 1
            fi

            (
              cd "$(dirname "${checksum_file}")"
              sha256sum --check "$(basename "${checksum_file}")"
            ) >&2

            checksum="$(cut -d ' ' -f 1 < "${checksum_file}")"
            if [[ ! "${checksum}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid SHA-256 checksum for ${archive}" >&2
              return 1
            fi
            printf '%s' "${checksum}"
          }

          macos_arm64_sha256="$(checksum_for "scoutly-aarch64-apple-darwin.tar.xz")"
          macos_intel_sha256="$(checksum_for "scoutly-x86_64-apple-darwin.tar.xz")"
          linux_arm64_sha256="$(checksum_for "scoutly-aarch64-unknown-linux-gnu.tar.xz")"
          linux_x86_64_sha256="$(checksum_for "scoutly-x86_64-unknown-linux-gnu.tar.xz")"

          cask_path="Casks/${cask_token}.rb"
          mkdir -p "tap/$(dirname "${cask_path}")"
          cat > "tap/${cask_path}" <<EOF
          # This file is generated by Scoutly release automation. DO NOT EDIT.
          cask "${cask_token}" do
            arch arm: "aarch64", intel: "x86_64"
            os macos: "apple-darwin", linux: "unknown-linux-gnu"

            version "${version}"
            sha256 arm:          "${macos_arm64_sha256}",
                   intel:        "${macos_intel_sha256}",
                   arm64_linux:  "${linux_arm64_sha256}",
                   x86_64_linux: "${linux_x86_64_sha256}"

            url "https://github.com/nelsonlaidev/scoutly/releases/download/v#{version}/scoutly-#{arch}-#{os}.tar.xz"
            name "${cask_name}"
            desc "Fast website auditing tool"
            homepage "https://github.com/nelsonlaidev/scoutly"

            livecheck do
              skip "Auto-generated on release."
            end

            binary "scoutly-#{arch}-#{os}/scoutly", target: "scoutly"

            postflight_steps do
              on_macos do
                run "/usr/bin/xattr",
                    args: ["-dr", "com.apple.quarantine", "{{staged_path}}/scoutly-{{arch}}-apple-darwin/scoutly"]
              end
            end
          end
          EOF

          echo "path=${cask_path}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${is_prerelease}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "token=${cask_token}" >> "${GITHUB_OUTPUT}"

      - name: Check Homebrew cask syntax
        run: ruby -c "tap/${{ steps.cask.outputs.path }}"

      - name: Commit Homebrew cask
        working-directory: tap
        env:
          CASK_PATH: ${{ steps.cask.outputs.path }}
          RELEASE_TAG: ${{ steps.cask.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${CASK_PATH}"
          if git diff --cached --quiet; then
            echo "${CASK_PATH} is already up to date"
            exit 0
          fi
          git commit -m "chore: update scoutly to ${RELEASE_TAG}"

      - name: Validate Homebrew cask
        env:
          CASK_PATH: ${{ steps.cask.outputs.path }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          export PATH="/home/linuxbrew/.linuxbrew/bin:${PATH}"
          brew update --force
          brew --version
          brew tap --custom-remote nelsonlaidev/tap "file://${GITHUB_WORKSPACE}/tap"
          brew trust --tap nelsonlaidev/tap
          tap_path="$(brew --repo nelsonlaidev/tap)"
          brew style --cask "${tap_path}/${CASK_PATH}"
          audit_args=(--cask --strict --online --os=all --arch=all)
          if [[ "${{ steps.cask.outputs.prerelease }}" == "true" ]]; then
            audit_args+=(--except=github_prerelease_version)
          fi
          brew audit "${audit_args[@]}" "nelsonlaidev/tap/${{ steps.cask.outputs.token }}"

      - name: Push Homebrew cask
        working-directory: tap
        run: |
          git push
