name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust Quality and Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          rustup default 1.96.0

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Check Rust package
        run: cargo check --locked --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

      - name: Install cargo-dist
        shell: bash
        run: >-
          curl --proto '=https' --tlsv1.2 -LsSf
          https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.sh
          | sh

      - name: Verify cargo-dist release plan
        run: |
          dist generate --check
          dist plan --output-format=json > dist-plan.json

      - name: Verify crate package
        run: cargo package --locked

  rust-msrv:
    name: Rust MSRV (1.96)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.96.0
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Verify declared MSRV
        run: |
          cargo +1.96.0 metadata --locked --no-deps --format-version 1 > cargo-metadata.json
          jq -e '.packages | length == 1 and .[0].rust_version == "1.96"' cargo-metadata.json

      - name: Check all targets with the MSRV
        run: cargo +1.96.0 check --locked --all-targets --all-features

  rust-test:
    name: Rust Native Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.96.0
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Run Rust tests and contract harness
        run: cargo +1.96.0 test --locked

  rust-security:
    name: Rust Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Audit locked Rust dependencies
        run: cargo audit --deny warnings

  rust-coverage:
    name: Rust Code Coverage
    runs-on: ubuntu-latest
    needs: [rust-test]
    if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component llvm-tools-preview
          rustup default 1.96.0

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none

      - name: Run Rust tests with coverage
        run: cargo llvm-cov --locked --all-features --workspace --lcov --output-path lcov.info

      - name: Upload Rust coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          flags: rust
          disable_search: true
          fail_ci_if_error: false
