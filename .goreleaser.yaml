version: 2

before:
  hooks:
    - go mod tidy

builds:
  - binary: scoutly
    main: ./cmd/scoutly/
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - arm64
      - amd64
      - '386'

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

release:
  prerelease: auto
  make_latest: '{{ if .Prerelease }}false{{ else }}true{{ end }}'

homebrew_casks:
  - name: '{{ if .Prerelease }}scoutly@beta{{ else }}scoutly{{ end }}'
    ids:
      - default
    binaries:
      - scoutly
    repository:
      owner: nelsonlaidev
      name: homebrew-tap
      branch: main
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    directory: Casks
    homepage: 'https://github.com/nelsonlaidev/scoutly'
    description: 'Fast website auditing tool'
    commit_msg_template: 'chore: update scoutly to {{ .Tag }}'
    skip_upload: false
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/scoutly"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
  groups:
    - title: 'New Features'
      regexp: '^.*?feat(\(.+\))?!?: .+$'
      order: 0
    - title: 'Bug Fixes'
      regexp: '^.*?fix(\(.+\))?!?: .+$'
      order: 1
    - title: 'Performance'
      regexp: '^.*?perf(\(.+\))?!?: .+$'
      order: 2
    - title: 'Others'
      order: 999
